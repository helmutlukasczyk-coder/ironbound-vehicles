<svg xmlns="http://www.w3.org/2000/svg" width="277mm" height="183mm" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">IRONBOUND — Saladin Assault Hover Tank — Standard</title><desc id="desc">Ground vehicle record. Override tactical conversion; IRONBOUND criticals and movement. EV uses standard BV2 G4/P5; crew paid separately.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1000" height="660" fill="#fff" stroke="none" rx="0" /><text x="22" y="26" font-size="14" fill="#243540" text-anchor="start" font-weight="bold">IRONBOUND</text><text x="143" y="26" font-size="10" fill="#61717c" text-anchor="start">UNIT RECORDS / GROUND VEHICLE</text><text x="22" y="59" font-size="28" fill="#243540" text-anchor="start" font-weight="bold">SALADIN</text><text x="22" y="80" font-size="16" fill="#a45426" text-anchor="start" font-weight="bold">STANDARD</text><text x="135" y="80" font-size="10" fill="#61717c" text-anchor="start">INNER SPHERE / HOVER / INTRO 2942</text><text x="613" y="29" font-size="11" fill="#a45426" text-anchor="start" font-weight="bold">CREW</text><path d="M657 31L864 31" fill="none" stroke="#83919a" /><text x="880" y="29" font-size="10" fill="#243540" text-anchor="start">ID:</text><path d="M901 31L975 31" fill="none" stroke="#83919a" /><text x="613" y="57" font-size="11" fill="#243540" text-anchor="start">Gunnery</text><path d="M666 59L698 59" fill="none" stroke="#83919a" /><text x="730" y="57" font-size="11" fill="#243540" text-anchor="start">Piloting</text><path d="M782 59L815 59" fill="none" stroke="#83919a" /><text x="613" y="81" font-size="10" fill="#243540" text-anchor="start">Injuries</text><rect x="660" y="71" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="676" y="71" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="692" y="71" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="708" y="71" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="724" y="71" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="740" y="71" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="776" y="81" font-size="10" fill="#243540" text-anchor="start">Acquired</text><path d="M829 83L975 83" fill="none" stroke="#83919a" /><text x="613" y="101" font-size="10" fill="#243540" text-anchor="start">Crew names:</text><path d="M690 103L975 103" fill="none" stroke="#83919a" /><rect x="22" y="106" width="310" height="24" fill="#243540" stroke="none" rx="0" /><text x="30" y="122" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">UNIT DATA</text><rect x="344" y="106" width="246" height="24" fill="#243540" stroke="none" rx="0" /><text x="352" y="122" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">MOTIVE DAMAGE</text><text x="30" y="145" font-size="12" fill="#243540" text-anchor="start">Mass</text><text x="200" y="145" font-size="12" fill="#243540" text-anchor="start" font-weight="bold">35 tons</text><text x="30" y="168" font-size="12" fill="#243540" text-anchor="start">Ground / Sprint</text><text x="200" y="168" font-size="12" fill="#243540" text-anchor="start" font-weight="bold">8 / 12 inches</text><text x="30" y="191" font-size="12" fill="#243540" text-anchor="start">Base TMM / Initiative</text><text x="200" y="191" font-size="12" fill="#243540" text-anchor="start" font-weight="bold">3 / 3</text><text x="30" y="214" font-size="12" fill="#243540" text-anchor="start">Movement type</text><text x="200" y="214" font-size="12" fill="#243540" text-anchor="start" font-weight="bold">Hover (h)</text><text x="30" y="237" font-size="12" fill="#243540" text-anchor="start">Catalogue role</text><text x="200" y="237" font-size="12" fill="#243540" text-anchor="start" font-weight="bold">Skirmisher</text><text x="352" y="145" font-size="11" fill="#243540" text-anchor="start">Motive hits:</text><rect x="429" y="134" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="449" y="134" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="469" y="134" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><rect x="489" y="134" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="352" y="167" font-size="10" fill="#243540" text-anchor="start">Each hit: Ground Move −2″; TMM −1.</text><text x="352" y="188" font-size="10" fill="#243540" text-anchor="start">Current Ground:</text><path d="M440 190L479 190" fill="none" stroke="#83919a" /><text x="489" y="188" font-size="10" fill="#243540" text-anchor="start">TMM:</text><path d="M524 190L577 190" fill="none" stroke="#83919a" /><rect x="352" y="204" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="369" y="214" font-size="10" fill="#243540" text-anchor="start">Immobilized</text><rect x="470" y="204" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="487" y="214" font-size="10" fill="#243540" text-anchor="start">Crew Stunned</text><text x="352" y="237" font-size="9" fill="#61717c" text-anchor="start">Initiative remains at the printed base bracket.</text><rect x="22" y="251" width="565" height="18" fill="#243540" stroke="none" rx="0" /><text x="34" y="263" font-size="12" fill="#fff" text-anchor="start" font-weight="bold">WEAPON TICS</text><text x="27" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">TIC / WEAPON</text><text x="257" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">DAMAGE</text><text x="363" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">ARC</text><text x="405" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">LOC</text><text x="449" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">PB</text><text x="481" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">S</text><text x="513" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">M</text><text x="545" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">L</text><text x="578" y="282" font-size="10" fill="#61717c" text-anchor="start" font-weight="bold">X</text><rect x="22" y="289" width="565" height="20" fill="#e8e9e7" stroke="none" rx="0" /><text x="27" y="303" font-size="11" fill="#243540" text-anchor="start" font-weight="bold">1  AC/20</text><text x="257" y="303" font-size="9" fill="#243540" text-anchor="start">7</text><text x="363" y="303" font-size="9" fill="#243540" text-anchor="start">Front</text><text x="405" y="303" font-size="9" fill="#243540" text-anchor="start">FR</text><text x="449" y="303" font-size="11" fill="#243540" text-anchor="start">+0</text><text x="481" y="303" font-size="11" fill="#243540" text-anchor="start">+0</text><text x="513" y="303" font-size="11" fill="#243540" text-anchor="start">+2</text><text x="545" y="303" font-size="11" fill="#243540" text-anchor="start">—</text><text x="578" y="303" font-size="11" fill="#243540" text-anchor="start">—</text><rect x="22" y="309" width="565" height="20" fill="#fff" stroke="none" rx="0" /><rect x="22" y="329" width="565" height="20" fill="#e8e9e7" stroke="none" rx="0" /><rect x="22" y="349" width="565" height="20" fill="#fff" stroke="none" rx="0" /><rect x="22" y="369" width="565" height="20" fill="#e8e9e7" stroke="none" rx="0" /><rect x="22" y="389" width="565" height="20" fill="#fff" stroke="none" rx="0" /><rect x="22" y="409" width="565" height="20" fill="#e8e9e7" stroke="none" rx="0" /><rect x="22" y="429" width="565" height="20" fill="#fff" stroke="none" rx="0" /><text x="27" y="475" font-size="9" fill="#61717c" text-anchor="start">AI: anti-infantry. IF: indirect fire. TU: turret; FR: front; BD: body.</text><text x="29" y="498" font-size="10" fill="#243540" text-anchor="start">Weapon losses / TIC:</text><rect x="164" y="488" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="181" y="498" font-size="11" fill="#243540" text-anchor="start" font-weight="bold">1</text><text x="22" y="512" font-size="11" fill="#243540" text-anchor="start" font-weight="bold">AMMUNITION / SHARED BINS</text><text x="22" y="526" font-size="9" fill="#243540" text-anchor="start" font-weight="bold">TIC / AMMO (LOC)</text><text x="160" y="526" font-size="9" fill="#243540" text-anchor="start" font-weight="bold">SHOTS</text><text x="273.5" y="526" font-size="9" fill="#243540" text-anchor="middle">Destroyed</text><text x="307" y="526" font-size="9" fill="#243540" text-anchor="start" font-weight="bold">TIC / AMMO (LOC)</text><text x="445" y="526" font-size="9" fill="#243540" text-anchor="start" font-weight="bold">SHOTS</text><text x="558.5" y="526" font-size="9" fill="#243540" text-anchor="middle">Destroyed</text><text x="22" y="540" font-size="10" fill="#243540" text-anchor="start" font-weight="bold">1 · AC/20 (BD)</text><text x="160" y="540" font-size="10" fill="#243540" text-anchor="start">______ / 5</text><rect x="268" y="530" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="22" y="553" font-size="10" fill="#243540" text-anchor="start" font-weight="bold">1 · AC/20 (BD)</text><text x="160" y="553" font-size="10" fill="#243540" text-anchor="start">______ / 5</text><rect x="268" y="543" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="307" y="540" font-size="10" fill="#243540" text-anchor="start" font-weight="bold">1 · AC/20 (BD)</text><text x="445" y="540" font-size="10" fill="#243540" text-anchor="start">______ / 5</text><rect x="553" y="530" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="22" y="568" font-size="9" fill="#243540" text-anchor="start">Each row is one bin; shared by listed TICs. Spend 1 shot per weapon fired.</text><text x="22" y="582" font-size="9.5" fill="#61717c" text-anchor="start">Equipment: ICE engine; standard structure; standard armor; no turret.</text><rect x="613" y="120" width="362" height="24" fill="#243540" stroke="none" rx="0" /><text x="621" y="136" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">ARMOR AND STRUCTURE</text><text x="794" y="160" font-size="10" fill="#243540" text-anchor="middle">Black: armor · Red: structure</text><rect x="708" y="183" width="172" height="277" fill="#d1d6d7" stroke="#243540" rx="10" /><rect x="681" y="194" width="22" height="260" fill="#aebbc0" stroke="#243540" rx="10" /><rect x="886" y="194" width="22" height="260" fill="#aebbc0" stroke="#243540" rx="10" /><path d="M716 194L872 194L851 270L737 270Z" fill="#b8c1c4" stroke="#243540" /><path d="M716 201L754 270L754 391L716 444Z" fill="#c4cbce" stroke="#243540" /><path d="M872 201L834 270L834 391L872 444Z" fill="#c4cbce" stroke="#243540" /><path d="M737 400L851 400L872 459L716 459Z" fill="#b8c1c4" stroke="#243540" /><circle cx="773.0" cy="208" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="787.0" cy="208" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="801.0" cy="208" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="815.0" cy="208" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="759.0" cy="255" r="5.5" fill="#fff" stroke="#b13737" stroke-width="1.7" /><circle cx="735.0" cy="283" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="735.0" cy="357" r="5.5" fill="#fff" stroke="#b13737" stroke-width="1.7" /><circle cx="853.0" cy="283" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="853.0" cy="357" r="5.5" fill="#fff" stroke="#b13737" stroke-width="1.7" /><circle cx="794.0" cy="412" r="5.5" fill="#fff" stroke="#243540" stroke-width="1.7" /><circle cx="794.0" cy="448" r="5.5" fill="#fff" stroke="#b13737" stroke-width="1.7" /><text x="794" y="178" font-size="10" fill="#243540" text-anchor="middle" font-weight="bold">Front (6–8)</text><text x="672" y="278" font-size="10" fill="#243540" text-anchor="end" font-weight="bold">Left Side</text><text x="672" y="293" font-size="10" fill="#243540" text-anchor="end">(9–11)</text><text x="918" y="278" font-size="10" fill="#243540" text-anchor="start" font-weight="bold">Right Side</text><text x="918" y="293" font-size="10" fill="#243540" text-anchor="start">(3–5)</text><text x="794" y="481" font-size="10" fill="#243540" text-anchor="middle" font-weight="bold">Rear (6–8; rear attack)</text><text x="613" y="508" font-size="10" fill="#243540" text-anchor="start">2 / 12: Floating Critical; reroll location.</text><text x="613" y="529" font-size="10" fill="#243540" text-anchor="start">Any location reduced to 0 Structure: destroyed.</text><text x="613" y="551" font-size="10" fill="#243540" text-anchor="start">Footprint:</text><path d="M672 553L708 553" fill="none" stroke="#83919a" /><text x="716" y="551" font-size="10" fill="#243540" text-anchor="start">×</text><path d="M730 553L768 553" fill="none" stroke="#83919a" /><text x="776" y="551" font-size="9" fill="#243540" text-anchor="start">inches (declare before deployment)</text><text x="613" y="572" font-size="10" fill="#243540" text-anchor="start">Critical effects:</text><path d="M699 574L975 574" fill="none" stroke="#83919a" /><path d="M613 591L975 591" fill="none" stroke="#83919a" /><rect x="22" y="604" width="953" height="27" fill="#e8ebea" stroke="none" rx="0" /><text x="29" y="622" font-size="10" fill="#243540" text-anchor="start">Destroyed</text><rect x="92" y="611" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="177" y="622" font-size="10" fill="#243540" text-anchor="start">Crew unconscious</text><rect x="282" y="611" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="382" y="622" font-size="10" fill="#243540" text-anchor="start">Abandoned</text><rect x="445" y="611" width="11" height="11" fill="#fff" stroke="#536572" rx="0" /><text x="613" y="622" font-size="9" fill="#243540" text-anchor="start">Injury checks: 3+ / 5+ / 7+ / 9+ / 11+ / Incap.</text><path d="M22 637L975 637" fill="none" stroke="#83919a" /><text x="22" y="652" font-size="10" fill="#243540" text-anchor="start" font-weight="bold">EV 596</text><text x="115" y="652" font-size="10" fill="#243540" text-anchor="start" font-weight="bold">CV 911,625 C-bills</text><text x="365" y="652" font-size="9" fill="#61717c" text-anchor="start">Upkeep 350/day + crew 500/day</text><text x="975" y="652" font-size="9" fill="#61717c" text-anchor="end">EV reference: Gunnery 4 / Piloting 5</text></g></svg>